services:
  python:
    build: .
    container_name: ia-tutor-ingles
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./graficos:/app/graficos
      - ./informes:/app/informes
      - ./notebooks:/app/notebooks
      - ./.streamlit:/app/.streamlit
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8501:8501"
    working_dir: /app
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
