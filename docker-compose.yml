services:
  python:
    build: .
    container_name: ia-tutor-ingles
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./graficos:/app/graficos
      - ./informes:/app/informes
      - ./notebooks:/app/notebooks
      - ./.streamlit:/app/.streamlit
    ports:
      - "8501:8501"
    working_dir: /app
    command: tail -f /dev/null
